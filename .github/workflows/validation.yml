# SPDX-License-Identifier: Apache-2.0

name: HolyCodex validation

on:
  push:
    branches-ignore:
      - main
      - release/**
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source SHA to validate and package
        required: true
        type: string
      release_channel:
        description: Optional release channel for exact artifact creation
        required: false
        default: ""
        type: string
      release_version:
        description: Version resolved by the caller when packaging a release
        required: true
        type: string
    outputs:
      artifact_name:
        description: Name of the exact release artifact
        value: ${{ jobs.package.outputs.artifact_name }}
      artifact_sha256:
        description: SHA-256 of the exact release tarball
        value: ${{ jobs.package.outputs.artifact_sha256 }}

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CI: "1"
      MSYS_NO_PATHCONV: "1"
    steps:
      - name: Check out the triggering SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Activate mise and install the pinned toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          install: true
          cache: false

      - name: Verify the mise-resolved Bun version
        run: mise exec -- bun --version

      - name: Install the frozen workspace
        run: mise exec -- bun install --frozen-lockfile

      - name: Run the repository-native validation gate
        run: mise exec -- bun run validate

      - name: Upload the validated Ubuntu build for release packaging
        if: inputs.release_channel != '' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: holycodex-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/cli/dist/index.js
            packages/cli/dist/agent.js
            packages/cli/dist/assets/plugin/plugin.json
            packages/cli/dist/assets/plugin/skills/**
          if-no-files-found: error
          retention-days: 14

  package:
    name: package exact release artifact
    if: inputs.release_channel != ''
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_sha256: ${{ steps.package.outputs.artifact_sha256 }}
    defaults:
      run:
        shell: bash
    env:
      CI: "1"
      MSYS_NO_PATHCONV: "1"
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_CHANNEL: ${{ inputs.release_channel }}
    steps:
      - name: Check out the triggering SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Activate mise and install the pinned toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          install: true
          cache: false

      - name: Install the frozen workspace
        run: mise exec -- bun install --frozen-lockfile

      - name: Reuse the validated Ubuntu build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: holycodex-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/cli/dist

      - name: Pack and verify the exact release artifact once
        id: package
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/release"
          mise exec -- bun scripts/package-release.ts create \
            "$RUNNER_TEMP/release" "$RELEASE_VERSION" "$RELEASE_CHANNEL" "$SOURCE_SHA"
          ARTIFACT_SHA256="$(mise exec -- bun scripts/package-release.ts digest "$RUNNER_TEMP/release")"
          ARTIFACT_NAME="holycodex-release-${RELEASE_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$ARTIFACT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload the verified tarball and identity manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/release/holycodex-${{ inputs.release_version }}.tgz
            ${{ runner.temp }}/release/release-metadata.json
          if-no-files-found: error
          retention-days: 14
