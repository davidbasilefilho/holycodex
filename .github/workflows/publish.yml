# SPDX-License-Identifier: Apache-2.0

name: HolyCodex release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "!v*.*.*-dev.*"
  workflow_dispatch:
    inputs:
      channel:
        description: Development from main or stable from an exact version tag
        required: true
        type: choice
        options:
          - dev
          - stable

permissions:
  contents: read

concurrency:
  group: holycodex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: resolve release identity
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: Check out the triggering SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Activate mise and install the pinned toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          install: true
          cache: false

      - name: Install the frozen workspace
        run: mise exec -- bun install --frozen-lockfile

      - name: Resolve the exact channel, tag, and source SHA
        id: release
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            CHANNEL=dev
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            CHANNEL=dev
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            CHANNEL=stable
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            CHANNEL="$REQUESTED_CHANNEL"
          else
            echo "The release workflow received an unsupported ref." >&2
            exit 1
          fi
          if [ "$CHANNEL" = "dev" ]; then
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              test "$GITHUB_REF" = "refs/heads/main"
            fi
            VERSION="$(mise exec -- bun scripts/release-version.ts dev "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT")"
          elif [ "$CHANNEL" = "stable" ]; then
            test "$GITHUB_REF_TYPE" = "tag"
            test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "$GITHUB_SHA"
            VERSION="$(mise exec -- bun scripts/release-version.ts stable "$GITHUB_REF_NAME")"
          else
            echo "Unsupported release channel: $CHANNEL" >&2
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  validation:
    name: required cross-platform validation and exact artifact
    needs: prepare
    uses: ./.github/workflows/validation.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      release_channel: ${{ needs.prepare.outputs.channel }}
      release_version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read

  publish_npm:
    name: publish exact npm artifact
    if: github.event_name != 'pull_request'
    needs: [prepare, validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      EXPECTED_SHA256: ${{ needs.validation.outputs.artifact_sha256 }}
    steps:
      - name: Check out the triggering SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the verified release artifact
        uses: ./.github/actions/verified-release-artifact
        with:
          artifact_name: ${{ needs.validation.outputs.artifact_name }}
          version: ${{ needs.prepare.outputs.version }}
          channel: ${{ needs.prepare.outputs.channel }}
          source_sha: ${{ needs.prepare.outputs.source_sha }}
          sha256: ${{ needs.validation.outputs.artifact_sha256 }}

      - name: Verify artifact identity and npm retry state
        id: npm_state
        run: |
          set -euo pipefail
          STATUS="$(mise exec -- bun scripts/package-release.ts check-npm \
            "$RUNNER_TEMP/release" "$RELEASE_VERSION" "$RELEASE_CHANNEL" "$SOURCE_SHA" "$EXPECTED_SHA256")"
          case "$STATUS" in
            absent|matching) echo "status=$STATUS" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected npm retry state: $STATUS" >&2; exit 1 ;;
          esac

      - name: Publish the exact artifact under the channel tag
        if: steps.npm_state.outputs.status == 'absent'
        run: |
          set -euo pipefail
          if [ "$RELEASE_CHANNEL" = dev ]; then
            NPM_TAG=dev
          else
            NPM_TAG=latest
          fi
          mise exec -- bunx npm@12 publish "$RUNNER_TEMP/release/holycodex-${RELEASE_VERSION}.tgz" --access public --tag "$NPM_TAG"

  publish_github:
    name: publish exact GitHub release
    if: github.event_name != 'pull_request'
    needs: [prepare, validation, publish_npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      EXPECTED_SHA256: ${{ needs.validation.outputs.artifact_sha256 }}
    steps:
      - name: Check out the triggering SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the verified release artifact
        uses: ./.github/actions/verified-release-artifact
        with:
          artifact_name: ${{ needs.validation.outputs.artifact_name }}
          version: ${{ needs.prepare.outputs.version }}
          channel: ${{ needs.prepare.outputs.channel }}
          source_sha: ${{ needs.prepare.outputs.source_sha }}
          sha256: ${{ needs.validation.outputs.artifact_sha256 }}

      - name: Create the identity-marked release notes
        run: mise exec -- bun scripts/package-release.ts notes "$RUNNER_TEMP/release" "$RUNNER_TEMP/release-notes.md"

      - name: Verify artifact identity and GitHub retry state
        id: github_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS="$(mise exec -- bun scripts/package-release.ts check-github \
            "$RUNNER_TEMP/release" "$RELEASE_VERSION" "$RELEASE_CHANNEL" "$SOURCE_SHA" "$EXPECTED_SHA256" "$GITHUB_REPOSITORY")"
          case "$STATUS" in
            absent|matching) echo "status=$STATUS" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected GitHub retry state: $STATUS" >&2; exit 1 ;;
          esac

      - name: Create the release from the verified source
        if: steps.github_state.outputs.status == 'absent'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ARGS=(
            "v${RELEASE_VERSION}"
            "$RUNNER_TEMP/release/holycodex-${RELEASE_VERSION}.tgz"
            --repo "$GITHUB_REPOSITORY"
            --generate-notes
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )
          if [ "$RELEASE_CHANNEL" = dev ]; then
            RELEASE_ARGS+=(--target "$SOURCE_SHA" --prerelease)
          else
            RELEASE_ARGS+=(--verify-tag)
          fi
          if [[ "$RELEASE_CHANNEL" = stable && "$RELEASE_VERSION" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${RELEASE_ARGS[@]}"
