name: Validate and publish

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an existing exact version tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          package-manager-cache: false
      - run: bunx --package vite-plus@0.2.7 vp install --frozen-lockfile
      - run: bunx --package vite-plus@0.2.7 vp check
      - run: bunx --package vite-plus@0.2.7 vp run build
      - run: bunx --package vite-plus@0.2.7 vp test
      - run: bun scripts/version.mjs check
      - run: git diff --exit-code

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          package-manager-cache: false
      - run: bunx --package vite-plus@0.2.7 vp install --frozen-lockfile
      - run: bunx --package vite-plus@0.2.7 vp run build
      - run: bunx --package vite-plus@0.2.7 vp test

  packed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          package-manager-cache: false
      - run: bunx --package vite-plus@0.2.7 vp install --frozen-lockfile
      - run: bunx --package vite-plus@0.2.7 vp run build
      - name: Validate packed install, doctor, and cleanup
        shell: bash
        run: |
          packed_root="$RUNNER_TEMP/holycodex-packed"
          mkdir -p "$packed_root/project"
          plugin_tar=$(npm pack ./packages/plugin --ignore-scripts --pack-destination "$packed_root")
          cli_tar=$(npm pack ./packages/cli --ignore-scripts --pack-destination "$packed_root")
          cd "$packed_root/project"
          npm init -y
          npm install --ignore-scripts "$packed_root/$plugin_tar" "$packed_root/$cli_tar"
          export CODEX_HOME="$packed_root/codex-home"
          node node_modules/holycodex/dist/cli.js install --json
          node node_modules/holycodex/dist/cli.js doctor --json
          node node_modules/holycodex/dist/cli.js cleanup --json

  package-dev-pr:
    if: github.event_name == 'pull_request'
    needs: [validate, macos, packed-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          package-manager-cache: false
      - run: bunx --package vite-plus@0.2.7 vp install --frozen-lockfile
      - name: Stamp development version
        run: bun scripts/version.mjs dev "${{ github.run_number }}" "${{ github.run_attempt }}"
      - run: bunx --package vite-plus@0.2.7 vp run build
      - name: Pack pull request development build
        shell: bash
        run: |
          mkdir -p dev-packages
          npm pack ./packages/plugin --ignore-scripts --pack-destination dev-packages
          npm pack ./packages/cli --ignore-scripts --pack-destination dev-packages
      - name: Publish pull request development build
        uses: actions/upload-artifact@v4
        with:
          name: holycodex-dev-${{ github.run_number }}-${{ github.run_attempt }}
          path: dev-packages/*.tgz
          if-no-files-found: error

  publish-dev-branch:
    if: startsWith(github.ref, 'refs/heads/')
    needs: [validate, macos, packed-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bunx --package vite-plus@0.2.7 vp install --frozen-lockfile
      - name: Stamp development version
        run: bun scripts/version.mjs dev "${{ github.run_number }}" "${{ github.run_attempt }}"
      - run: bunx --package vite-plus@0.2.7 vp run build
      - run: bun scripts/publish.mjs dev
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --generate-notes \
            --title "HolyCodex $version"

  publish-stable:
    if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [validate, macos, packed-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bunx --package vite-plus@0.2.7 vp install --frozen-lockfile
      - run: bunx --package vite-plus@0.2.7 vp run build
      - run: bun scripts/publish.mjs stable
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --verify-tag \
            --generate-notes \
            --title "HolyCodex $version"
