name: publish-native-packages

on:
  push:
    branches: [next]
    tags: ["v0.17.0-1"]
  workflow_dispatch:
    inputs:
      validation_only:
        description: Build native DEV artifacts only; do not publish npm or GitHub releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: holycodex-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    if: github.repository == 'davidbasilefilho/holycodex'
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.route.outputs.channel }}
      version: ${{ steps.route.outputs.version }}
      publish: ${{ steps.route.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: route
        shell: bash
        env:
          VALIDATION_ONLY: ${{ inputs.validation_only }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node npm/packager/channel.cjs route "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$VALIDATION_ONLY" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v0.17.0-1 ]]; then
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          fi
  dev:
    needs: route
    if: needs.route.outputs.channel == 'dev'
    uses: ./.github/workflows/dev.yml
    with:
      version: ${{ needs.route.outputs.version }}
  stable:
    needs: route
    if: needs.route.outputs.channel == 'stable'
    uses: ./.github/workflows/stable.yml
    with:
      version: ${{ needs.route.outputs.version }}
  publish:
    needs: [route, dev, stable]
    if: >-
      always() && needs.route.result == 'success' && needs.route.outputs.publish == 'true' &&
      (github.event_name != 'workflow_dispatch' || !inputs.validation_only) &&
      ((needs.route.outputs.channel == 'dev' && needs.dev.result == 'success') ||
      (needs.route.outputs.channel == 'stable' && needs.stable.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_CHANNEL: ${{ needs.route.outputs.channel }}
      PACKAGE_VERSION: ${{ needs.route.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify accepted source before publishing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$PACKAGE_CHANNEL" == dev ]]; then
            current="$(git ls-remote origin refs/heads/next | cut -f1)"
            test "$current" = "$GITHUB_SHA"
          else
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: Install pinned OIDC-capable npm
        run: npm install --global npm@12.2.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: holycodex-${{ needs.route.outputs.version }}-*-${{ github.sha }}
          path: .tmp/release-artifacts
          merge-multiple: false
      - name: Verify and publish all platforms before the wrapper
        shell: bash
        run: node npm/packager/publish.cjs .tmp/release-artifacts "$GITHUB_SHA" "$PACKAGE_VERSION" "$PACKAGE_CHANNEL"
      - name: Publish or recover matching GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: node npm/packager/github-release.cjs .tmp/release-artifacts "$GITHUB_SHA" "$PACKAGE_VERSION" "$PACKAGE_CHANNEL"
