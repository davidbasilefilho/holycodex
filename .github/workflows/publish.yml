# SPDX-License-Identifier: Apache-2.0

name: HolyCodex publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: validate release artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Activate mise and install pinned toolchain
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: false

      - name: Install frozen workspace
        run: mise exec -- bun install --frozen-lockfile

      - name: Run complete repository validation gate
        run: mise exec -- bun run validate

      - name: Upload validated package payload
        uses: actions/upload-artifact@v4
        with:
          name: validated-package-${{ github.sha }}
          path: |
            packages/cli/dist
            packages/cli/package.json
            packages/cli/README.md
          if-no-files-found: error
          retention-days: 7

  publish-dev:
    name: publish npm dev and GitHub prerelease
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Activate mise and install pinned toolchain
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: false

      - name: Configure npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Install frozen workspace
        run: mise exec -- bun install --frozen-lockfile

      - name: Download validated package payload
        uses: actions/download-artifact@v4
        with:
          name: validated-package-${{ github.sha }}
          path: validated

      - name: Restore validated package payload
        run: |
          rm -rf packages/cli/dist
          cp -R validated/dist packages/cli/dist
          cp validated/package.json packages/cli/package.json
          cp validated/README.md packages/cli/README.md

      - name: Derive unique dev identity
        id: identity
        shell: bash
        run: |
          canonical="$(mise exec -- bun -e 'console.log((await import("./packages/cli/package.json", { with: { type: "json" } })).default.version)')"
          identity="$(mise exec -- bun scripts/release-version.ts dev "$canonical" "${GITHUB_RUN_NUMBER}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_SHA}")"
          version="$(mise exec -- bun -e 'const x=JSON.parse(process.argv[1]); console.log(x.version)' "$identity")"
          tag="$(mise exec -- bun -e 'const x=JSON.parse(process.argv[1]); console.log(x.tag)' "$identity")"
          printf 'version=%s\ntag=%s\n' "$version" "$tag" >> "$GITHUB_OUTPUT"

      - name: Apply transient dev package version
        working-directory: packages/cli
        run: npm pkg set version='${{ steps.identity.outputs.version }}'

      - name: Pack exact publish artifact
        id: pack
        shell: bash
        run: |
          rm -rf release-artifact
          mkdir release-artifact
          npm pack ./packages/cli --pack-destination release-artifact --json > release-artifact/pack.json
          file="$(mise exec -- bun -e 'const x=JSON.parse(await Bun.file("release-artifact/pack.json").text()); console.log(x[0].filename)')"
          printf 'file=%s\n' "$file" >> "$GITHUB_OUTPUT"
          sha256sum "release-artifact/$file" > "release-artifact/$file.sha256"

      - name: Publish npm dev with provenance
        run: npm publish 'release-artifact/${{ steps.pack.outputs.file }}' --provenance --tag dev

      - name: Create matching GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.identity.outputs.tag }}' \
            'release-artifact/${{ steps.pack.outputs.file }}' \
            'release-artifact/${{ steps.pack.outputs.file }}.sha256' \
            --target "$GITHUB_SHA" \
            --prerelease \
            --generate-notes \
            --title 'HolyCodex ${{ steps.identity.outputs.version }}'

  publish-stable:
    name: publish npm latest and GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out exact validated tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Activate mise and install pinned toolchain
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: false

      - name: Configure npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Install frozen workspace
        run: mise exec -- bun install --frozen-lockfile

      - name: Download validated package payload
        uses: actions/download-artifact@v4
        with:
          name: validated-package-${{ github.sha }}
          path: validated

      - name: Restore validated package payload
        run: |
          rm -rf packages/cli/dist
          cp -R validated/dist packages/cli/dist
          cp validated/package.json packages/cli/package.json
          cp validated/README.md packages/cli/README.md

      - name: Verify stable tag matches canonical version
        id: identity
        shell: bash
        run: |
          canonical="$(mise exec -- bun -e 'console.log((await import("./packages/cli/package.json", { with: { type: "json" } })).default.version)')"
          identity="$(mise exec -- bun scripts/release-version.ts stable "$canonical" "$GITHUB_REF_NAME")"
          version="$(mise exec -- bun -e 'const x=JSON.parse(process.argv[1]); console.log(x.version)' "$identity")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Pack exact stable artifact
        id: pack
        shell: bash
        run: |
          rm -rf release-artifact
          mkdir release-artifact
          npm pack ./packages/cli --pack-destination release-artifact --json > release-artifact/pack.json
          file="$(mise exec -- bun -e 'const x=JSON.parse(await Bun.file("release-artifact/pack.json").text()); console.log(x[0].filename)')"
          printf 'file=%s\n' "$file" >> "$GITHUB_OUTPUT"
          sha256sum "release-artifact/$file" > "release-artifact/$file.sha256"

      - name: Publish npm stable with provenance
        run: npm publish 'release-artifact/${{ steps.pack.outputs.file }}' --provenance --tag latest

      - name: Create GitHub stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            'release-artifact/${{ steps.pack.outputs.file }}' \
            'release-artifact/${{ steps.pack.outputs.file }}.sha256' \
            --verify-tag \
            --generate-notes \
            --title 'HolyCodex ${{ steps.identity.outputs.version }}'
