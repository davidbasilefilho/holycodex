name: publish-native-packages

on:
  workflow_run:
    workflows: [native-release-validation]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'v0.17.0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify checkout matches the validated source
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: holycodex-0.17.0-*-${{ github.event.workflow_run.head_sha }}
          path: .tmp/release-artifacts
          merge-multiple: false
      - name: Verify all packages against the validated source SHA
        run: node npm/packager/verify-release.cjs .tmp/release-artifacts "$VERIFIED_SHA"
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Publish native packages, then wrapper with npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          for package in \
            holycodex-native-darwin-arm64 \
            holycodex-native-linux-x64-gnu \
            holycodex-native-win32-x64 \
            holycodex; do
            archive="$(find .tmp/release-artifacts -type f -name "${package}-0.17.0.tgz" -print -quit)"
            test -n "$archive"
            expected_integrity="$(node -e 'const fs=require("node:fs"),crypto=require("node:crypto");process.stdout.write("sha512-"+crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$archive")"
            error_file="$RUNNER_TEMP/npm-view-${package}.stderr"
            if published_integrity="$(npm view "${package}@0.17.0" dist.integrity 2>"$error_file")"; then
              if [[ "$published_integrity" != "$expected_integrity" ]]; then
                echo "Published ${package}@0.17.0 integrity does not match validated artifact" >&2
                exit 1
              fi
              echo "Verified existing ${package}@0.17.0; skipping duplicate publish"
            else
              status=$?
              if grep -q 'E404' "$error_file"; then
                npx --yes npm@12 publish "$archive" --access public --tag latest --provenance
              else
                cat "$error_file" >&2
                exit "$status"
              fi
            fi
          done
