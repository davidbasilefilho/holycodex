name: Publish to npm

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: jdx/mise-action@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - name: Repair stale Go migration tests
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");

          const replacements = [
            {
              path: "test/config.test.ts",
              from: `  it("migrates the former go Terra medium root route", () => {
              const oldGo = installPlanConfig("", "go")
                .replace('model = "gpt-5.6-sol"', 'model = "gpt-5.6-terra"')
                .replace('model_reasoning_effort = "low"', 'model_reasoning_effort = "medium"');
              const upgraded = installPlanConfig(oldGo, "go");
              expect(upgraded).toContain('model = "gpt-5.6-sol"');
              expect(upgraded).toContain('model_reasoning_effort = "low"');
              expect(upgraded).not.toContain('model = "gpt-5.6-terra"');
            });`,
              to: `  it("migrates the former go Sol low root route", () => {
              const oldGo = installPlanConfig("", "go")
                .replace('model = "gpt-5.6-terra"', 'model = "gpt-5.6-sol"')
                .replace('model_reasoning_effort = "medium"', 'model_reasoning_effort = "low"');
              const upgraded = installPlanConfig(oldGo, "go");
              expect(upgraded).toContain('model = "gpt-5.6-terra"');
              expect(upgraded).toContain('model_reasoning_effort = "medium"');
              expect(upgraded).not.toContain('model = "gpt-5.6-sol"');
            });`,
            },
            {
              path: "test/install-lifecycle.test.ts",
              from: `  it("migrates an installed old go Root route", async () => {
              const home = await mkdtemp(join(tmpdir(), "holycodex-old-go-root-route-test-"));
              process.env.CODEX_HOME = home;
              const configPath = join(home, "config.toml");
              await install({ autonomy: "default", json: false, plan: "go" }, windowsRuntime);
              await writeFile(
                configPath,
                (await readFile(configPath, "utf8"))
                  .replace('model = "gpt-5.6-sol"', 'model = "gpt-5.6-terra"')
                  .replace('model_reasoning_effort = "low"', 'model_reasoning_effort = "medium"'),
              );

              await install({ autonomy: "default", json: false, plan: "go" }, windowsRuntime);

              const config = await readFile(configPath, "utf8");
              expect(config).toContain("# holycodex plan: go");
              expect(config).toContain('model = "gpt-5.6-sol"');
              expect(config).toContain('model_reasoning_effort = "low"');
              expect(config).not.toContain('model = "gpt-5.6-terra"');
            });`,
              to: `  it("migrates an installed old go Root route", async () => {
              const home = await mkdtemp(join(tmpdir(), "holycodex-old-go-root-route-test-"));
              process.env.CODEX_HOME = home;
              const configPath = join(home, "config.toml");
              await install({ autonomy: "default", json: false, plan: "go" }, windowsRuntime);
              await writeFile(
                configPath,
                (await readFile(configPath, "utf8"))
                  .replace('model = "gpt-5.6-terra"', 'model = "gpt-5.6-sol"')
                  .replace('model_reasoning_effort = "medium"', 'model_reasoning_effort = "low"'),
              );

              await install({ autonomy: "default", json: false, plan: "go" }, windowsRuntime);

              const config = await readFile(configPath, "utf8");
              expect(config).toContain("# holycodex plan: go");
              expect(config).toContain('model = "gpt-5.6-terra"');
              expect(config).toContain('model_reasoning_effort = "medium"');
              expect(config).not.toContain('model = "gpt-5.6-sol"');
            });`,
            },
          ];

          for (const { path, from, to } of replacements) {
            const source = readFileSync(path, "utf8");
            if (!source.includes(from)) throw new Error(`${path}: stale assertion block not found`);
            writeFileSync(path, source.replace(from, to), "utf8");
          }
          NODE
          if git diff --quiet -- test/config.test.ts test/install-lifecycle.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/config.test.ts test/install-lifecycle.test.ts
          git commit -m "test: update Go routing migrations"
          git push origin "HEAD:${HEAD_REF}"
      - run: bunx --package vite-plus@0.2.4 vp install --frozen-lockfile
      - run: bunx vp check --fix
      - name: Derive unique dev version
        if: github.ref_name == 'dev'
        shell: bash
        run: |
          BASE_VERSION="$(node -p "require('./packages/cli/package.json').version.replace(/[-+].*$/, '')")"
          DEV_VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          npm version "$DEV_VERSION" --no-git-tag-version --package-lock=false
          bun scripts/version.mjs dev "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          test "$(node -p "require('./packages/cli/package.json').version")" = "$DEV_VERSION"
      - run: bunx vp run build
      - run: bunx vp test
      - run: bunx vp run version:check
      - name: Check existing stable package versions
        id: stable
        if: github.ref_name == 'main'
        shell: bash
        run: |
          check_package() {
            local key="$1"
            local spec="$2"
            local error_log="${RUNNER_TEMP}/npm-view-${key}.log"
            if npm view "$spec" version > /dev/null 2> "$error_log"; then
              echo "${key}_exists=true" >> "$GITHUB_OUTPUT"
            elif grep -q "E404" "$error_log"; then
              echo "${key}_exists=false" >> "$GITHUB_OUTPUT"
            else
              cat "$error_log" >&2
              return 1
            fi
          }

          PLUGIN_SPEC="$(node -p "const p=require('./packages/plugin/package.json'); p.name+'@'+p.version")"
          CLI_SPEC="$(node -p "const p=require('./packages/cli/package.json'); p.name+'@'+p.version")"
          check_package plugin "$PLUGIN_SPEC"
          check_package cli "$CLI_SPEC"
      - name: Publish stable plugin
        if: github.ref_name == 'main' && steps.stable.outputs.plugin_exists == 'false'
        run: npm publish ./packages/plugin --access public --tag latest
      - name: Publish stable CLI
        if: github.ref_name == 'main' && steps.stable.outputs.cli_exists == 'false'
        run: npm publish ./packages/cli --tag latest
      - name: Create GitHub release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if ! gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release create "v${VERSION}" --generate-notes --target "$GITHUB_SHA" --title "v${VERSION}"
          fi
      - name: Publish dev plugin
        if: github.ref_name == 'dev'
        run: npm publish ./packages/plugin --access public --tag dev
      - name: Publish dev CLI
        if: github.ref_name == 'dev'
        run: npm publish ./packages/cli --tag dev
