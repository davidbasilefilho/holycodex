name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: false
          cache: true
      - run: mise install --locked rust
      - run: mise run fmt-check
      - run: mise run lint
      - run: mise run test
      - name: Prove TOON Unicode regressions fail on the prior revision
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          baseline_sha=ce141d0d7b0aceb2fb2a4219890b5982d358acf4
          test_file=crates/holycodex-toon/tests/typed_parity.rs
          temp_root="$(mktemp -d "$RUNNER_TEMP/holycodex-baseline.XXXXXX")"
          baseline_tree="$temp_root/tree"
          cleanup() {
            git worktree remove --force "$baseline_tree" >/dev/null 2>&1 || true
            rm -rf -- "$temp_root"
          }
          trap cleanup EXIT

          if ! git cat-file -e "$baseline_sha^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$baseline_sha"
          fi
          git cat-file -e "$baseline_sha^{commit}"
          git worktree add --detach "$baseline_tree" "$baseline_sha"
          git show "$GITHUB_SHA:$test_file" > "$baseline_tree/$test_file"

          expect_baseline_test_failure() {
            local test_name="$1"
            local log_file="$temp_root/$test_name.log"
            if CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo test --locked -p holycodex-toon --test typed_parity --features de_direct -- "$test_name" --exact --nocapture >"$log_file" 2>&1; then
              echo "Expected $test_name to fail on $baseline_sha, but it passed" >&2
              cat "$log_file" >&2
              return 1
            fi
            if ! grep -F "test $test_name ... FAILED" "$log_file" >/dev/null || \
               ! grep -F 'test result: FAILED. 0 passed; 1 failed' "$log_file" >/dev/null; then
              echo "Expected an executed failing test named $test_name; failure was not a regression assertion" >&2
              cat "$log_file" >&2
              return 1
            fi
            echo "Confirmed $test_name fails on baseline $baseline_sha after executing the test"
          }

          cd "$baseline_tree"
          expect_baseline_test_failure unicode_surrogate_pairs_decode_and_malformed_pairs_are_rejected
          expect_baseline_test_failure safe_path_expansion_preserves_literal_leading_zero_width_space_keys
