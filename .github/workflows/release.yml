name: native-release-validation

on:
  push:
    branches: [main]
    tags: ["v0.17.0"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holycodex-native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Set isolated Codex home
        shell: bash
        run: echo "CODEX_HOME=$RUNNER_TEMP/holycodex-release-codex-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true
          cache: true
      - run: mise run fmt-check
      - run: mise run lint
      - run: mise run test

  wrapper:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Set isolated Codex home
        shell: bash
        run: echo "CODEX_HOME=$RUNNER_TEMP/holycodex-release-codex-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true
          cache: true
      - name: Stage wrapper and run isolated npm install tests
        run: |
          cargo run --locked -p holycodex-npm-packager -- wrapper .tmp/npm
          npm pack --pack-destination .tmp/npm .tmp/npm/holycodex
          npm test --prefix npm/holycodex
      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'source_sha = "%s"\n' "$actual" > .tmp/npm/source-revision.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holycodex-0.17.0-wrapper-${{ github.sha }}
          path: |
            .tmp/npm/holycodex-0.17.0.tgz
            .tmp/npm/source-revision.toml
          if-no-files-found: error

  native:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64-gnu
            package: holycodex-native-linux-x64-gnu
          - runner: macos-latest
            target: darwin-arm64
            package: holycodex-native-darwin-arm64
          - runner: windows-latest
            target: win32-x64
            package: holycodex-native-win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set isolated Codex home
        shell: bash
        run: echo "CODEX_HOME=$RUNNER_TEMP/holycodex-release-codex-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true
          cache: true
      - name: Check runner matches advertised target
        run: node -e "const p=require('node:process');const t='${{ matrix.target }}';const ok={'linux-x64-gnu':p.platform==='linux'&&p.arch==='x64','darwin-arm64':p.platform==='darwin'&&p.arch==='arm64','win32-x64':p.platform==='win32'&&p.arch==='x64'};if(!ok[t])throw Error(t+' requires native runner; got '+p.platform+'-'+p.arch)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Materialize pinned Codex with HolyCodex layer
        run: cargo run --locked -p holycodex-dev -- materialize --upstream .tmp/upstream
      - name: Install pinned Codex test runners
        run: |
          cargo install just --locked
          cargo install cargo-nextest --locked
      - name: Test focused HolyCodex behavior on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -euo pipefail
          unset RUSTUP_TOOLCHAIN
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          printf 'focused_test_source_sha=%s\n' "$source_sha"
          git diff --exit-code
          cd .tmp/upstream
          expected_toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' codex-rs/rust-toolchain.toml)"
          test -n "$expected_toolchain"
          rustup toolchain install "$expected_toolchain" --profile minimal --component rustfmt
          toolchain_bin="$(dirname "$(rustup which --toolchain "$expected_toolchain" cargo)")"
          export PATH="$toolchain_bin:$PATH"
          actual_toolchain="$(cd codex-rs && rustc -V | awk '{print $2}')"
          printf 'upstream_toolchain_expected=%s actual=%s\n' "$expected_toolchain" "$actual_toolchain"
          test "$actual_toolchain" = "$expected_toolchain"
          just test --locked --build-jobs 1 --test-threads 1 -p codex-core --lib --test all -E 'test(/(?:holycodex|holy|all_specialist_routes_allocate_and_build_requests_for_each_profile|quality_command_artifacts_are_cached_per_specialist_workspace|specialist_shell_authorization_reuses_workspace_cache_across_workdirs|reserved_command_tools_reject_external_runtimes_without_a_builtin|registry_records_reserved_exec_command_when_a_matching_tool_exists|shell_snapshot_tests|npm_workspace_snapshot|snapshot.*(?:unix|executable|root.?links?|symlink|race|budgets?|retention)|(?:unix|executable|root.?links?|symlink|race|budgets?|retention).*snapshot|operational.*grant|grant.*operational|spawn.*rollback|rollback.*spawn)/)'
          just test --locked --build-jobs 1 --test-threads 1 -p codex-login -p codex-skills -p codex-skills-extension --lib -E 'test(/siwc::tests|embedded_holycodex_017_skill_inventory_is_complete|optional_workflows/)'
          cd "$GITHUB_WORKSPACE"
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          printf 'focused_test_source_sha_after=%s\n' "$source_sha"
          git diff --exit-code
      - name: Test pinned Codex CLI with its toolchain
        shell: bash
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -euo pipefail
          unset RUSTUP_TOOLCHAIN
          cd .tmp/upstream
          expected_toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' codex-rs/rust-toolchain.toml)"
          test -n "$expected_toolchain"
          rustup toolchain install "$expected_toolchain" --profile minimal --component rustfmt
          toolchain_bin="$(dirname "$(rustup which --toolchain "$expected_toolchain" cargo)")"
          export PATH="$toolchain_bin:$PATH"
          actual_toolchain="$(cd codex-rs && rustc -V | awk '{print $2}')"
          printf 'upstream_toolchain_expected=%s actual=%s\n' "$expected_toolchain" "$actual_toolchain"
          test "$actual_toolchain" = "$expected_toolchain"
          just test --locked --build-jobs 1 --test-threads 1 -p codex-cli
      - name: Build one native runtime under both names
        run: cargo run --locked -p holycodex-dev -- package --upstream .tmp/upstream --output .tmp/native --release
      - name: Stage and pack platform npm package
        run: |
          cargo run --locked -p holycodex-npm-packager -- ${{ matrix.target }} .tmp/native .tmp/npm
          npm pack --pack-destination .tmp/npm .tmp/npm/${{ matrix.package }}
          npm test --prefix npm/holycodex
      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'source_sha = "%s"\n' "$actual" > .tmp/npm/source-revision.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holycodex-0.17.0-${{ matrix.target }}-${{ github.sha }}
          path: |
            .tmp/npm/${{ matrix.package }}-0.17.0.tgz
            .tmp/npm/source-revision.toml
          if-no-files-found: error
