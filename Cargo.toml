[workspace]
members = [
    "crates/holycodex-dev",
    "crates/holycodex-policy",
    "crates/holycodex-toon",
    "npm/packager",
]
resolver = "3"

[workspace.package]
version = "0.17.0-1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
