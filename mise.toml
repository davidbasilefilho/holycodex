[tools]
bun = "1.4"
node = "latest"
npm = "latest"
rust = { version = "stable", profile = "default", components = ["rustfmt", "clippy"] }

[settings]
lockfile = true

[settings.npm]
package_manager = "bun"

[tool_alias]
# Use the npm backend so npm.package_manager installs npm itself with Bun.
npm = "npm:npm"

[tool_alias.rust.versions]
# Deliberately maintained stable snapshot; advance explicitly and re-lock.
stable = "1.99.0"

[tasks.fmt]
description = "Format Rust workspace sources"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Run locked workspace Clippy with warnings denied"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.test]
description = "Run locked Rust workspace tests"
run = ["cargo test --workspace --locked", "cargo test --locked -p holycodex-toon --features de_direct", "cargo test --locked -p holycodex-toon --all-features", "cargo test --locked -p holycodex-toon --no-default-features --features std,serde", 'npm exec --offline --call "node --test npm/packager/publish.test.cjs npm/packager/native-smoke.test.cjs npm/packager/installation-smoke.test.cjs"']

[tasks.pre-commit]
description = "Run formatting, lint, and test checks"
depends = ["fmt-check", "lint", "test"]
